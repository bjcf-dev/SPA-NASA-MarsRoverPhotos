name: Testing

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: true
    steps:
      - name: ⬇ Git checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 💾 Install modules
        run: pnpm install --frozen-lockfile

      - name: 🧪 Run tests
        run: npm test -- --run
