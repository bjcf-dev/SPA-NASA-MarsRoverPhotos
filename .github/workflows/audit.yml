name: Code audit

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  audit:
    name: Code audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: ⬇ Git checkout
        uses: actions/checkout@v4

      - name: 🔧 Setup Node
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: 💾 Install modules
        run: pnpm install --frozen-lockfile

      - name: 🔍 Lint
        run: npx eslint --max-warnings 5

